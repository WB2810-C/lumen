<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E6E8EC">
<title>Lumen Remote</title>
<style>
  :root { --ink:#12151C; --mut:rgba(18,21,28,.62); --card:rgba(255,255,255,.82); --line:rgba(18,21,28,.08); --soft:rgba(18,21,28,.05); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, sans-serif; color:var(--ink);
         background:radial-gradient(circle at 0% 0%, #BFD0E8 0, transparent 45%),
                    radial-gradient(circle at 100% 60%, #E3D3F2 0, transparent 40%),
                    radial-gradient(circle at 0% 100%, #D3E6E1 0, transparent 40%), #E6E8EC;
         background-attachment:fixed;
         min-height:100vh; }
  main { max-width:480px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 24px) 18px 40px; display:flex; flex-direction:column; gap:16px; }
  header { display:flex; align-items:center; justify-content:space-between; }
  h1 { margin:0; font-size:30px; letter-spacing:-.5px; }
  .status { font-size:14px; color:var(--mut); display:flex; align-items:center; gap:6px; margin-top:2px; }
  .dot { width:8px; height:8px; border-radius:4px; background:#34C759; }
  .dot.off { background:#FF3B30; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:16px; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
  .label { font-size:13px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--mut); margin:0 4px 10px; }
  .card .label { margin:0 0 10px; }
  .row { display:flex; gap:10px; }
  input { flex:1; min-width:0; height:46px; border-radius:14px; border:none; background:var(--soft); padding:0 14px; font-size:16px; color:var(--ink); outline:none; }
  input:focus { background:rgba(18,21,28,.08); }
  button { border:none; font:inherit; cursor:pointer; color:inherit; }
  .go { height:46px; min-width:46px; padding:0 16px; border-radius:14px; background:var(--ink); color:#fff; font-size:15px; font-weight:600; }
  .go:active, .tile:active, .chip:active, .ctl:active { transform:scale(.96); }
  .answer { margin-top:12px; font-size:16px; line-height:1.4; display:none; }
  .answer.show { display:block; }
  .np { display:flex; gap:14px; align-items:center; }
  .cover { flex:none; width:58px; height:58px; border-radius:12px; background:linear-gradient(135deg,#F2B66D,#C2267A 55%,#2B2B8C); }
  .np-text { flex:1; min-width:0; }
  .np-title { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np-sub { font-size:13px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ctls { display:flex; gap:8px; align-items:center; }
  .ctl { width:40px; height:40px; border-radius:20px; background:transparent; display:flex; align-items:center; justify-content:center; }
  .ctl.main { background:var(--ink); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .tile { height:76px; border-radius:18px; background:var(--card); border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px; }
  .tile b { font-size:24px; }
  .tile span { font-size:11px; margin-top:2px; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { padding:9px 15px; border-radius:18px; font-size:14px; font-weight:600; background:var(--card); border:1px solid var(--line); }
  .chip.on { background:var(--ink); color:#fff; }
  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%) translateY(120px); background:var(--ink); color:#fff; padding:12px 18px; border-radius:16px; font-size:15px; transition:transform .25s; }
  .toast.show { transform:translateX(-50%) translateY(0); }
  svg { display:block; }
  .pick { width:100%; height:54px; border-radius:16px; background:var(--ink); color:#fff; font-size:16px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:10px; }
  .sub { font-size:13px; color:var(--mut); margin-top:8px; }
  .bar { height:6px; border-radius:3px; background:var(--soft); margin-top:12px; overflow:hidden; display:none; }
  .bar.show { display:block; }
  .bar div { height:100%; width:0; background:var(--ink); transition:width .2s; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Lumen</h1>
      <div class="status"><span class="dot" id="dot"></span><span id="status">Connected to your TV</span></div>
    </div>
  </header>

  <section class="card">
    <div class="label">Ask Lumen</div>
    <form class="row" id="askForm">
      <input id="ask" placeholder="Ask anything…" autocomplete="off" enterkeyhint="send">
      <button class="go" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg></button>
    </form>
    <div class="answer" id="answer"></div>
  </section>

  <section class="card np" id="np" style="display:none">
    <div class="cover"></div>
    <div class="np-text"><div class="np-title" id="npTitle"></div><div class="np-sub" id="npSub"></div></div>
    <div class="ctls">
      <button class="ctl" aria-label="Previous" data-media="prev"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6l-8 6 8 6z"/><rect x="5" y="6" width="2.4" height="12" rx="1"/></svg></button>
      <button class="ctl main" aria-label="Play or pause" data-media="toggle"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.5" height="14" rx="1"/><rect x="13.5" y="5" width="3.5" height="14" rx="1"/></svg></button>
      <button class="ctl" aria-label="Next" data-media="next"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 6l8 6-8 6z"/><rect x="16.6" y="6" width="2.4" height="12" rx="1"/></svg></button>
    </div>
  </section>

  <section class="card">
    <div class="label">Show on TV</div>
    <button class="pick" id="pick"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M12 9v5M9.5 11.5L12 9l2.5 2.5"/><line x1="8" y1="21" x2="16" y2="21"/></svg>Photos, videos or files</button>
    <input type="file" id="file" accept="image/*,video/*,audio/*,application/pdf" multiple hidden>
    <div class="sub" id="pickSub">From your library, the Files app or iCloud Drive.</div>
    <div class="bar" id="bar"><div id="barFill"></div></div>
  </section>

  <section class="card">
    <div class="label">YouTube</div>
    <form class="row" id="ytForm">
      <input id="yt" placeholder="Search or paste a link" autocomplete="off" enterkeyhint="go">
      <button class="go">Play</button>
    </form>
  </section>

  <section>
    <div class="label">Open on TV</div>
    <div class="grid" id="apps"></div>
  </section>

  <section>
    <div class="label">Theme</div>
    <div class="chips" id="themes"></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
  const key = new URLSearchParams(location.search).get('k') || '';
  const api = (path, body) => fetch(path + '?k=' + encodeURIComponent(key), body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  }).then(r => r.json());
  const $ = id => document.getElementById(id);

  function toast(text) {
    const t = $('toast'); t.textContent = text; t.classList.add('show');
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  $('askForm').addEventListener('submit', async e => {
    e.preventDefault();
    const text = $('ask').value.trim(); if (!text) return;
    $('ask').value = ''; $('ask').blur();
    const box = $('answer'); box.textContent = 'Thinking…'; box.classList.add('show');
    try { const r = await api('/api/ask', { text }); box.textContent = r.answer || '…'; }
    catch { box.textContent = 'The TV didn’t answer. Is Lumen open?'; }
  });

  $('ytForm').addEventListener('submit', async e => {
    e.preventDefault();
    const q = $('yt').value.trim(); if (!q) return;
    $('yt').value = ''; $('yt').blur();
    await api('/api/youtube', { q }); toast('Sent to YouTube');
  });

  $('pick').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', async () => {
    const files = Array.from($('file').files || []);
    $('file').value = '';
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      $('pickSub').textContent = (files.length > 1 ? `(${i + 1}/${files.length}) ` : '') + 'Sending ' + f.name + '…';
      $('bar').classList.add('show'); $('barFill').style.width = '0%';
      try { await upload(f); } catch { toast('Couldn\u2019t send ' + f.name); }
    }
    $('bar').classList.remove('show');
    $('pickSub').textContent = 'From your library, the Files app or iCloud Drive.';
    if (files.length) toast(files.length > 1 ? 'Sent ' + files.length + ' files to the TV' : 'Showing on TV');
  });
  function upload(f) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload?k=' + encodeURIComponent(key) + '&name=' + encodeURIComponent(f.name || 'file'));
      xhr.upload.onprogress = e => { if (e.lengthComputable) $('barFill').style.width = Math.round(e.loaded / e.total * 100) + '%'; };
      xhr.onload = () => xhr.status === 200 ? resolve() : reject();
      xhr.onerror = reject;
      xhr.send(f);
    });
  }

  document.querySelectorAll('[data-media]').forEach(b =>
    b.addEventListener('click', () => api('/api/media', { action: b.dataset.media })));

  let lastApps = '', lastThemes = '';
  function render(state) {
    const apps = (state.favourites && state.favourites.length ? state.favourites : state.apps || []).concat(state.inputs || []).slice(0, 12);
    const appsKey = JSON.stringify(apps);
    if (appsKey !== lastApps) {
      lastApps = appsKey;
      $('apps').innerHTML = '';
      apps.forEach(a => {
        const b = document.createElement('button'); b.className = 'tile';
        b.innerHTML = '<b></b><span></span>'; b.querySelector('b').textContent = a.label.charAt(0); b.querySelector('span').textContent = a.label;
        b.addEventListener('click', async () => { await api('/api/open', { key: a.key }); toast('Opening ' + a.label); });
        $('apps').appendChild(b);
      });
    }
    const themesKey = JSON.stringify(state.themes) + state.theme;
    if (themesKey !== lastThemes) {
      lastThemes = themesKey;
      $('themes').innerHTML = '';
      (state.themes || []).forEach(t => {
        const b = document.createElement('button'); b.className = 'chip' + (t.id === state.theme ? ' on' : ''); b.textContent = t.name;
        b.addEventListener('click', async () => { await api('/api/theme', { id: t.id }); refresh(); });
        $('themes').appendChild(b);
      });
    }
    const np = state.nowPlaying;
    $('np').style.display = np ? 'flex' : 'none';
    if (np) { $('npTitle').textContent = np.title; $('npSub').textContent = [np.artist, np.app].filter(Boolean).join(' · '); }
  }

  async function refresh() {
    try { render(await api('/api/state')); $('dot').classList.remove('off'); $('status').textContent = 'Connected to your TV'; }
    catch { $('dot').classList.add('off'); $('status').textContent = 'Can’t reach the TV'; }
  }
  refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
