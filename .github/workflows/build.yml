# Builds PlaizierOS in the cloud, for free, every time the code changes.
# No Android Studio needed: GitHub's computers have the Android tools.
# Result: Releases → latest → PlaizierOS-installer.zip  (also under Actions → the run → Artifacts)

name: Build PlaizierOS

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-lumen
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build the APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --console=plain --stacktrace 2>&1 | tee build-log.txt

      - name: Pack the installer
        shell: bash
        run: |
          mkdir -p out/PlaizierOS-installer
          cp app/build/outputs/apk/release/app-release.apk out/PlaizierOS-installer/PlaizierOS.apk
          cp installer/* out/PlaizierOS-installer/
          cd out && zip -qr PlaizierOS-installer.zip PlaizierOS-installer

      - name: Keep it under Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlaizierOS-installer
          path: out/PlaizierOS-installer/

      - name: Publish it under Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            out/PlaizierOS-installer.zip out/PlaizierOS-installer/PlaizierOS.apk \
            --target "${{ github.sha }}" \
            --title "PlaizierOS · build ${{ github.run_number }}" \
            --notes "Download PlaizierOS-installer.zip, unzip it, then double-click Install-PlaizierOS.bat." \
            --latest

      # Leaves the log (and the installer) on a separate branch, so the result can be read back with plain git.
      - name: Leave the result on the build-output branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/result
          cp build-log.txt /tmp/result/ 2>/dev/null || echo "The build stopped before Gradle ran." > /tmp/result/build-log.txt
          cp out/PlaizierOS-installer.zip /tmp/result/ 2>/dev/null || true
          echo "${{ job.status }} · build ${{ github.run_number }} · ${{ github.sha }}" > /tmp/result/status.txt
          cd /tmp/result
          git init -q -b build-output
          git add -A
          git -c user.name="PlaizierOS build" -c user.email="actions@users.noreply.github.com" commit -qm "Build ${{ github.run_number }}: ${{ job.status }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-output
